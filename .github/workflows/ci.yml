name: Backend Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app.services.guest_generator \
            --cov=app.services.speech_scheduler \
            --cov=app.services.insight_extractor \
            --cov=app.services.event_bus \
            --cov=app.services.discussion_service \
            --cov=app.services.guest_service \
            --cov-report=term \
            --cov-report=html \
            --junitxml=junit.xml

      - name: Coverage threshold check
        run: |
          pytest tests/ \
            --cov=app.services \
            --cov-fail-under=80

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/junit.xml
            backend/htmlcov/

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint (if configured)
        run: npx eslint src/ --ext .ts,.tsx || echo "ESLint not configured, skipping"

  seed-data-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify DB init + seed data
        run: |
          python ../scripts/init_db.py --seed
          python -c "
          from app.database import SessionLocal
          from app.models import Discussion, Guest
          db = SessionLocal()
          disc_count = db.query(Discussion).count()
          guest_count = db.query(Guest).count()
          print(f'Discussions: {disc_count}, Guests: {guest_count}')
          assert disc_count == 7, f'Expected 7 discussions, got {disc_count}'
          assert guest_count > 0, 'Expected guests to be created'
          db.close()
          print('✅ Seed data verified')
          "
